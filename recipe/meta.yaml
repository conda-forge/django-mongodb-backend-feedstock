{% set name = "django-mongodb-backend" %}
{% set version = "6.0.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/django_mongodb_backend-{{ version }}.tar.gz
  sha256: f3f4d3df0a69061a008f4254baaa7cd10ad5f3e98ec054b0d251edd1611fd1a3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-requirements-txt >=0.4.1
    - pip
  run:
    - python >={{ python_min }}
    - django >=6.0,<6.1
    - pymongo >=4.7,<5.0
    # - sphinx-copybutton 
    # - sphinx >=7
    # - furo >=2025.7.19

test:
  imports:
    - django_mongodb_backend
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}


about:
  summary: Django MongoDB Backend
  home: https://www.mongodb.com/docs/languages/python/django-mongodb/current/
  dev_url: https://github.com/mongodb-labs/django-mongodb-backend
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
